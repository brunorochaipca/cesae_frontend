<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calcular média</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 24rem;
            margin: 2rem auto;
        }

        label {
            display: block;
            margin-top: 0.75rem;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.4rem;
        }

        button {
            margin-top: 1rem;
        }

        #resultado {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Calcular média</h1>

    <label for="quantidade">Quantos números?</label>
    <input type="number" id="quantidade" min="1" max="20" value="3">

    <div id="campos"></div>

    <button type="button" onclick="calcularMedia()">Calcular média</button>
    <p id="resultado"></p>

    <script>
        var quantidade = document.getElementById("quantidade");
        var campos = document.getElementById("campos");
        var resultado = document.getElementById("resultado");

        function criarCampos() {
            var total = Number(quantidade.value);

            campos.innerHTML = "";
            resultado.textContent = "";

            if (!Number.isInteger(total) || total < 1 || total > 20) {
                resultado.textContent = "Escolha entre 1 e 20 números.";
                return;
            }

            for (var i = 1; i <= total; i++) {
                var label = document.createElement("label");
                label.htmlFor = "numero" + i;
                label.textContent = "Número " + i;

                var input = document.createElement("input");
                input.type = "number";
                input.id = "numero" + i;
                input.step = "any";

                campos.appendChild(label);
                campos.appendChild(input);
            }
        }

        function calcularMedia() {
            var inputs = campos.querySelectorAll("input");
            var valores = [];
            var i;

            if (inputs.length === 0) {
                resultado.textContent = "Escolha entre 1 e 20 números.";
                return;
            }

            for (i = 0; i < inputs.length; i++) {
                valores.push(inputs[i].value);
            }

            if (valores.some(function (v) { return v.trim() === ""; })) {
                resultado.textContent = "Por favor, preencha todos os campos.";
                return;
            }

            var numeros = valores.map(function (v) { return parseFloat(v); });
            if (numeros.some(isNaN)) {
                resultado.textContent = "Insira apenas números válidos.";
                return;
            }

            var soma = numeros.reduce(function (acc, val) { return acc + val; }, 0);
            var media = soma / numeros.length;

            resultado.textContent = "A média é: " + media.toFixed(2);
        }

        quantidade.addEventListener("input", criarCampos);
        criarCampos();

    </script>
</body>

</html>
